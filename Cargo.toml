[package]
name = "cleanflow"
version = "0.4.0"
edition = "2021"
description = "High-performance Windows Disk Cleaner & Junction Migrator in Rust"
authors = ["CleanFlow Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
jwalk = "0.8"
anyhow = "1.0"
thiserror = "2.0"
regex = "1.11"
tiny_http = "0.12"
blake3 = { version = "1.5", features = ["rayon"] }
hex = "0.4.3"

[dev-dependencies]
md-5 = "0.11.0"

