; CleanFlow Pro - Curated Core WinApp2 Ruleset
; Formatted according to WinApp2.ini community specification

[Visual Studio Code Cache*]
DetectFile=%APPDATA%\Code
Default=True
FileKey1=%APPDATA%\Code\Cache|*.*|RECURSE
FileKey2=%APPDATA%\Code\CachedData|*.*|RECURSE
FileKey3=%APPDATA%\Code\Service Worker\CacheStorage|*.*|RECURSE
FileKey4=%APPDATA%\Code\logs|*.*|RECURSE

[Cursor Editor Cache*]
DetectFile=%APPDATA%\Cursor
Default=True
FileKey1=%APPDATA%\Cursor\Cache|*.*|RECURSE
FileKey2=%APPDATA%\Cursor\CachedData|*.*|RECURSE
FileKey3=%APPDATA%\Cursor\Service Worker\CacheStorage|*.*|RECURSE
FileKey4=%APPDATA%\Cursor\logs|*.*|RECURSE

[Google Chrome Cache*]
DetectFile=%LOCALAPPDATA%\Google\Chrome
Default=True
FileKey1=%LOCALAPPDATA%\Google\Chrome\User Data\Default\Cache|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Google\Chrome\User Data\Default\Code Cache|*.*|RECURSE
FileKey3=%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache|*.*|RECURSE

[Microsoft Edge Cache*]
DetectFile=%LOCALAPPDATA%\Microsoft\Edge
Default=True
FileKey1=%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Cache|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Microsoft\Edge\User Data\Default\Code Cache|*.*|RECURSE

[Mozilla Firefox Cache*]
DetectFile=%LOCALAPPDATA%\Mozilla\Firefox
Default=True
FileKey1=%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\startupCache|*.*|RECURSE

[WeChat PC Cache*]
DetectFile=%APPDATA%\Tencent\WeChat
Default=True
FileKey1=%APPDATA%\Tencent\WeChat\xweb\crash|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Tencent\WeChat\All Users\config\temp|*.*|RECURSE

[Tencent QQ Cache*]
DetectFile=%APPDATA%\Tencent\QQ
Default=True
FileKey1=%APPDATA%\Tencent\QQ\Temp|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Tencent\QQNT\crash|*.*|RECURSE

[Discord Cache*]
DetectFile=%APPDATA%\discord
Default=True
FileKey1=%APPDATA%\discord\Cache|*.*|RECURSE
FileKey2=%APPDATA%\discord\Code Cache|*.*|RECURSE
FileKey3=%APPDATA%\discord\GPUCache|*.*|RECURSE

[Slack Cache*]
DetectFile=%APPDATA%\Slack
Default=True
FileKey1=%APPDATA%\Slack\Cache|*.*|RECURSE
FileKey2=%APPDATA%\Slack\Service Worker\CacheStorage|*.*|RECURSE

[JetBrains IDEs System Logs*]
DetectFile=%LOCALAPPDATA%\JetBrains
Default=True
FileKey1=%LOCALAPPDATA%\JetBrains\*\log|*.*|RECURSE

[Git Credential & Temp Cache*]
DetectFile=%USERPROFILE%\.gitconfig
Default=True
FileKey1=%LOCALAPPDATA%\GitCredentialManager\trace|*.*|RECURSE

[Spotify Music Cache*]
DetectFile=%LOCALAPPDATA%\Spotify
Default=True
FileKey1=%LOCALAPPDATA%\Spotify\Storage|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Spotify\Data|*.*|RECURSE

[Steam Shader & Download Cache*]
DetectFile=%LOCALAPPDATA%\Steam
Default=True
FileKey1=%LOCALAPPDATA%\Steam\htmlcache|*.*|RECURSE
FileKey2=%LOCALAPPDATA%\Steam\widevine|*.*|RECURSE

[Adobe Common Cache*]
DetectFile=%APPDATA%\Adobe
Default=True
FileKey1=%APPDATA%\Adobe\Common\Media Cache Files|*.*|RECURSE
FileKey2=%APPDATA%\Adobe\Common\Media Cache|*.*|RECURSE

[Windows Delivery Optimization Cache*]
DetectFile=%WINDIR%\SoftwareDistribution
Default=True
FileKey1=%WINDIR%\SoftwareDistribution\DeliveryOptimization\Cache|*.*|RECURSE
